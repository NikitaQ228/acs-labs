spring.application.name=library-project
spring.config.import=optional:file:./.env[.properties][encoding=utf-8],optional:file:./library-project/.env[.properties][encoding=utf-8]

spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:shema.sql
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false

spring.artemis.mode=native
spring.artemis.broker-url=${LIBRARY_ARTEMIS_URL:tcp://127.0.0.1:61616}
spring.artemis.user=${LIBRARY_ARTEMIS_USER:}
spring.artemis.password=${LIBRARY_ARTEMIS_PASSWORD:}
spring.jms.pub-sub-domain=true

spring.mail.host=${LIBRARY_SMTP_HOST:127.0.0.1}
spring.mail.port=${LIBRARY_SMTP_PORT:1025}
spring.mail.username=${LIBRARY_SMTP_USER:}
spring.mail.password=${LIBRARY_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${LIBRARY_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${LIBRARY_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
library.mail.from=${LIBRARY_MAIL_FROM:library@example.test}
library.mail.to=${LIBRARY_MAIL_TO:reader@example.test}
