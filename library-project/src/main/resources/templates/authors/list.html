<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Авторы')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('authors')}"></header>
<main>
    <div class="page-title">
        <h1>Авторы <small th:text="${#lists.size(authors)}"></small></h1>
        <a class="button" th:href="@{/authors/new}">Добавить автора</a>
    </div>
    <p th:replace="~{fragments/layout :: feedback}"></p>
    <form class="search" th:action="@{/authors}" method="get" role="search">
        <input type="search" name="q" th:value="${q}" placeholder="Имя или фамилия" aria-label="Поиск авторов">
        <button class="secondary" type="submit">Найти</button>
        <a th:if="${!#strings.isEmpty(q)}" th:href="@{/authors}">Сбросить</a>
    </form>
    <div class="table-wrap">
        <table>
            <thead>
            <tr><th scope="col">Автор</th><th scope="col">Дата рождения</th><th scope="col">Книги</th><th scope="col">Действия</th></tr>
            </thead>
            <tbody>
            <tr th:each="author : ${authors}">
                <td><a th:href="@{/authors/{id}/edit(id=${author.id})}" th:text="${author.firstName + ' ' + author.lastName}"></a></td>
                <td th:text="${author.birthDate != null ? #temporals.format(author.birthDate, 'dd.MM.yyyy') : '—'}"></td>
                <td>
                    <div th:each="book : ${author.books}">
                        <a th:href="@{/books/{id}/edit(id=${book.id})}" th:text="${book.title}"></a>
                    </div>
                    <span class="muted" th:if="${#sets.isEmpty(author.books)}">Пока нет</span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{/authors/{id}/edit(id=${author.id})}">Изменить</a>
                        <form th:action="@{/authors/{id}/delete(id=${author.id})}" method="post"
                              onsubmit="return confirm('Удалить автора? Его книги останутся в библиотеке.')">
                            <button class="delete" type="submit">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(authors)}">
                <td colspan="4" class="empty" th:text="${#strings.isEmpty(q) ? 'Пока нет авторов. Добавьте первого.' : 'Авторы не найдены. Попробуйте другой запрос.'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
