<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Библиотека'">Библиотека</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header" th:fragment="header(active)">
    <a class="logo" th:href="@{/books}">Библиотека</a>
    <nav aria-label="Основная навигация">
        <a th:href="@{/books}" th:attr="aria-current=${active == 'books' ? 'page' : null}">Книги</a>
        <a th:href="@{/authors}" th:attr="aria-current=${active == 'authors' ? 'page' : null}">Авторы</a>
    </nav>
</header>
<p class="notice" role="status" th:fragment="feedback" th:if="${success}" th:text="${success}"></p>
</body>
</html>
