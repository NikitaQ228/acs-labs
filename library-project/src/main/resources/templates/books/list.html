<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Книги')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('books')}"></header>
<main>
    <div class="page-title">
        <h1>Книги <small th:text="${#lists.size(books)}"></small></h1>
        <a class="button" th:href="@{/books/new}">Добавить книгу</a>
    </div>
    <p th:replace="~{fragments/layout :: feedback}"></p>
    <form class="search" th:action="@{/books}" method="get" role="search">
        <input type="search" name="q" th:value="${q}" placeholder="Название, автор или ISBN" aria-label="Поиск книг">
        <button class="secondary" type="submit">Найти</button>
        <a th:if="${!#strings.isEmpty(q)}" th:href="@{/books}">Сбросить</a>
    </form>
    <div class="table-wrap">
        <table>
            <thead>
            <tr><th scope="col">Название</th><th scope="col">Авторы</th><th scope="col">Год</th><th scope="col">ISBN</th><th scope="col">Действия</th></tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td><a th:href="@{/books/{id}/edit(id=${book.id})}" th:text="${book.title}"></a></td>
                <td>
                    <span th:each="author, state : ${book.authors}" th:text="${author.firstName + ' ' + author.lastName + (state.last ? '' : ', ')}"></span>
                    <span class="muted" th:if="${#sets.isEmpty(book.authors)}">Не указаны</span>
                </td>
                <td th:text="${book.publicationYear}"></td>
                <td class="isbn" th:text="${book.isbn}"></td>
                <td>
                    <div class="actions">
                        <a th:href="@{/books/{id}/edit(id=${book.id})}">Изменить</a>
                        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post"
                              onsubmit="return confirm('Удалить книгу? Данные авторов сохранятся.')">
                            <button class="delete" type="submit">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(books)}">
                <td colspan="5" class="empty" th:text="${#strings.isEmpty(q) ? 'Пока нет книг. Добавьте первую.' : 'Книги не найдены. Попробуйте другой запрос.'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
